<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f7" />
    <!-- Resolve the theme before first paint. Mirrors src/lib/theme.ts. -->
    <script>
      ;(function () {
        var pref = null
        try {
          pref = localStorage.getItem('patholytics.theme')
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#0a0e14')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Patholytics — The pathologist's toolkit, sharpened</title>
    <meta
      name="description"
      content="Scoring, staging, and differential support in one place. Precision tools built for the way pathologists actually sign out cases."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Patholytics — The pathologist's toolkit, sharpened" />
    <meta
      property="og:description"
      content="Scoring, staging, and differential support in one place. Precision tools built for the way pathologists actually sign out cases."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
